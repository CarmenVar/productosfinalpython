<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin: 20px auto; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <h1>📦 Lista de Productos</h1>
    <a href="/registrar" style="margin-left: 10%; display: inline-block; margin-top: 20px; text-decoration: none; background-color: #4CAF50; color: white; padding: 10px 20px; border-radius: 5px;">➕ Agregar nuevo producto</a>
    <table>
        <tr>
            <th>ID</th><th>Nombre</th><th>Categoría</th><th>Cantidad</th><th>Precio</th><th>Acciones</th>
        </tr>
        {% for p in productos %}
        <tr>
            <td>{{ p[0] }}</td>
            <td>{{ p[1] }}</td>
            <td>{{ p[2] }}</td>
            <td>{{ p[3] }}</td>
            <td>${{ "%.2f"|format(p[4]) }}</td>
            <td>
                <!-- 2. Botón de borrar con confirmación para cada fila -->
                <a href="/eliminar/{{ p[0] }}" style="color: #d9534f; text-decoration: none; font-weight: bold;" onclick="return confirm('¿Estás segura de eliminar este producto?');">🗑️ Borrar</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
